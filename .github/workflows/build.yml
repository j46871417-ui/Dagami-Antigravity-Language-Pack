name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  ANTIGRAVITY_SKIP_KILL: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build language packs
        run: |
          python extract_ru_dict.py
          python build_language_packs.py

      - name: Check JavaScript syntax
        run: node --check translations/structured_thoughts.js

      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Test structured translation in a browser
        run: node tests/test_structured_thoughts.cjs

      - name: Run Python unit tests
        env:
          PYTHONIOENCODING: utf-8
          ANTIGRAVITY_SKIP_KILL: "1"
        run: python -m unittest discover -s tests -t .

      - name: Verify source bundle integrity
        run: python verify_build_artifact.py

  build:
    needs: test
    uses: ./.github/workflows/native-ports.yml
