name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole --name AntigravityLocalizer --add-data "translations;translations" --add-data "assets;assets" --clean antigravity_localizer.py
          copy dist\AntigravityLocalizer.exe AntigravityLocalizer.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityLocalizer
          path: AntigravityLocalizer.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AntigravityLocalizer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
